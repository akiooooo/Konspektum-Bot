name: Ошибка
description: Воспроизводимая проблема в приложении
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Не публикуйте токены и данные покупателей.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      placeholder: ОС, версия Python, браузер, коммит
