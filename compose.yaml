services:
  shop:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_PATH: /app/data/konspektum.sqlite3
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - konspektum_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  konspektum_data:
